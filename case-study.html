            <div style="display:grid;grid-template-columns:{{ textCols }};gap:clamp(12px,1.6vw,24px);">
              <div role="img" aria-label="{{ b.altA }}" style="width:100%;aspect-ratio:{{ b.ratioA }};background-color:#141413;background-position:center;background-size:cover;background-image:{{ b.bgA }};"></div>
              <div role="img" aria-label="{{ b.altB }}" style="width:100%;aspect-ratio:{{ b.ratioA }};background-color:#141413;background-position:center;background-size:cover;background-image:{{ b.bgB }};"></div>
            </div>
            <div style="position:relative;width:100%;aspect-ratio:{{ b.vratio }};overflow:hidden;background:#141413;">
              <video data-src="{{ b.vsrc }}" aria-label="{{ b.valt }}" autoPlay="{{ true }}" muted="{{ true }}" loop="{{ true }}" playsInline="{{ true }}" preload="metadata" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;"></video>
            </div>
          </div>
        </sc-if>
        <sc-if value="{{ b.isBleedVideo }}" hint-placeholder-val="{{ false }}">
          <div style="position:relative;width:100%;aspect-ratio:{{ b.cropRatio }};overflow:hidden;background:#0b0b0b;">
            <video data-src="{{ b.vsrc }}" aria-label="{{ b.valt }}" autoPlay="{{ true }}" muted="{{ true }}" loop="{{ true }}" playsInline="{{ true }}" preload="auto" style="position:absolute;left:{{ b.vL }};top:{{ b.vT }};width:{{ b.vW }};height:{{ b.vH }};max-width:none;"></video>
          </div>
        </sc-if>
        <sc-if value="{{ b.cap }}" hint-placeholder-val="{{ false }}">
          <span style="font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:#8e8e89;">{{ b.cap }}</span>
        </sc-if>
      </div>
    </sc-for>

    <a href="{{ nextHref }}" onClick="{{ goNext }}" style-hover="background-color:#f2f2ef;color:#0b0b0b;padding-left:clamp(16px,2vw,32px);padding-right:clamp(16px,2vw,32px);" style="margin-top:clamp(48px,8vw,120px);display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;padding:28px 0 clamp(40px,6vw,72px);border-top:1px solid #2a2a2a;transition:background-color 0.45s cubic-bezier(0.65,0,0.35,1),color 0.45s cubic-bezier(0.65,0,0.35,1),padding 0.45s cubic-bezier(0.65,0,0.35,1);">
      <span style="display:flex;flex-direction:column;gap:12px;">
        <span style="font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;opacity:0.6;">Next project</span>
        <span style="font-size:clamp(36px,6vw,96px);font-weight:700;letter-spacing:-0.05em;line-height:0.9;">{{ next.title }}</span>
      </span>
      <svg viewBox="0 0 500 500" fill="currentColor" aria-hidden="true" style="display:block;width:clamp(28px,3.4vw,56px);height:auto;flex:none;"><polygon points="77,0 405,328 405,32 500,127 500,500 127,500 32,405 328,405 0,77"></polygon></svg>
    </a>
  </article>
</main>
</sc-if>
</script>
<script>(function(){var l=document.getElementById('loader');if(!l)return;
if(window.parent!==window||document.documentElement.hasAttribute('data-ret')){l.remove();return;}

Promise.all(ready).then(function(){if(document.querySelector('null-stage')&&window.__nullStagesReady)Promise.race([window.__nullStagesReady,new Promise(function(r){setTimeout(r,10000);})]).then(done);else done();});setTimeout(done,13000);})();</script>
